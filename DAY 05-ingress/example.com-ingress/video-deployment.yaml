apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-deployment
  labels:
    app: video
spec:
  replicas: 2
  selector:
    matchLabels:
      app: video
  template:
    metadata:
      labels:
        app: video
    spec:
      containers:
        - image: kiran2361993/kubegame:v1
          name: kubegame
          ports:
           - containerPort: 80
