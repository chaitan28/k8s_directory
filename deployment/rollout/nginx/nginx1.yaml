apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
spec:
  minReadySeconds: 10
  replicas: 4
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx
        ports:
        - containerPort: 80
      - name: alpine-container 
        image: alpine:latest 
        command: ["/bin/sh"] 
        args: ["-c", "while true; do echo hello; sleep 10; done"]
        ports:
        - containerPort: 8081
      - name: sidecar-container 
        image: busybox:latest 
        command: ["/bin/sh"] 
        args: ["-c", "while true; do echo world; sleep 10; done"]
        ports:
        - containerPort: 8082