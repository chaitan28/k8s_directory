apiVersion: v1    # This specifies the version of the Kubernetes API. u can search on the panel with command kubectl api-resources --namespaced=true
kind: Pod          # Indicates the type of object you're creating; in this case, it's a Pod.
metadata:          # Metadata is used by Kubernetes to organize, track, and manage resources.
  labels:          # Labels are key-value pairs . Labels help identify and categorize resources and are typically used for filtering and selecting resources.   
    run: nginx-1      # if you have multiple pods running Nginx, you can assign this label to all of them, making it easier to find and manage them together.
  name: nginx1      # The name of the Pod
  namespace: dev    # The namespace in which the Pod resides
spec:
  containers:
  - image: nginx       # Specifies the container image to use
    name: nginx-dev    # The name of the container
    ports:
    - containerPort: 80
  
---
apiVersion: v1
kind: Pod
metadata:
  labels:
    run: nginx-2
  name: nginx2
  namespace: qa
spec:
  containers:
  - image: nginx
    name: nginx-qa
    ports:
    - containerPort: 80

    

